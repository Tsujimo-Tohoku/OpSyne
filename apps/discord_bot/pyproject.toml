[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "opsyne-discord"
version = "0.1.0.dev0"
description = "Isolated Discord notification and interaction adapter for OpSyne"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.28,<1",
    "pydantic>=2.10,<3",
    "pynacl>=1.5,<2",
    "uvicorn>=0.34,<1",
]
classifiers = ["Private :: Do Not Upload"]

[project.scripts]
opsyne-discord = "opsyne_discord.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/opsyne_discord"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "docs", "examples", "README.md", "pyproject.toml", "uv.lock", "dev.py", "check.py", ".env.example"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".local", ".uv-cache"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests", "dev.py", "check.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-config --strict-markers --import-mode=importlib"
filterwarnings = ["error"]

[dependency-groups]
dev = [
    "hatchling>=1.27,<2",
    "mypy>=1.15,<2",
    "pytest>=8.3,<10",
    "ruff>=0.11,<1",
]
